<text x="40" y="1675" font-size="16" font-weight="700" fill="#14213d">Enumerações</text>
<rect x="40" y="1693" width="470" height="72" rx="6" fill="#fff8e6" stroke="#8a6a1f" stroke-width="1.5"/>
<text x="50" y="1715" font-size="14" font-weight="700" fill="#6b4f10">&lt;&lt;enumeration&gt;&gt; StatusPedido</text>
<text x="50" y="1735" font-size="11.5" fill="#3b3b3b">PENDENTE | EM_PRODUCAO | CONCLUIDO | CANCELADO | ENTREGUE</text>
<rect x="530" y="1693" width="470" height="72" rx="6" fill="#fff8e6" stroke="#8a6a1f" stroke-width="1.5"/>
<text x="540" y="1715" font-size="14" font-weight="700" fill="#6b4f10">&lt;&lt;enumeration&gt;&gt; CanalOrigem</text>
<text x="540" y="1735" font-size="11.5" fill="#3b3b3b">WHATSAPP | INSTAGRAM | SITE | PRESENCIAL</text>
<rect x="1020" y="1693" width="470" height="72" rx="6" fill="#fff8e6" stroke="#8a6a1f" stroke-width="1.5"/>
<text x="1030" y="1715" font-size="14" font-weight="700" fill="#6b4f10">&lt;&lt;enumeration&gt;&gt; StatusAprovacao</text>
<text x="1030" y="1735" font-size="11.5" fill="#3b3b3b">PENDENTE | EM_ANALISE | APROVADA | REPROVADA |</text>
<text x="1030" y="1750" font-size="11.5" fill="#3b3b3b">REVISAO_SOLICITADA</text>
<rect x="40" y="1781" width="470" height="72" rx="6" fill="#fff8e6" stroke="#8a6a1f" stroke-width="1.5"/>
<text x="50" y="1803" font-size="14" font-weight="700" fill="#6b4f10">&lt;&lt;enumeration&gt;&gt; StatusPagamento</text>
<text x="50" y="1823" font-size="11.5" fill="#3b3b3b">PENDENTE | APROVADO | RECUSADO | CANCELADO | ESTORNADO</text>
<rect x="530" y="1781" width="470" height="72" rx="6" fill="#fff8e6" stroke="#8a6a1f" stroke-width="1.5"/>
<text x="540" y="1803" font-size="14" font-weight="700" fill="#6b4f10">&lt;&lt;enumeration&gt;&gt; FormaPagamento</text>
<text x="540" y="1823" font-size="11.5" fill="#3b3b3b">DINHEIRO | PIX | CARTAO_CREDITO | CARTAO_DEBITO | BOLETO</text>
<rect x="1020" y="1781" width="470" height="72" rx="6" fill="#fff8e6" stroke="#8a6a1f" stroke-width="1.5"/>
<text x="1030" y="1803" font-size="14" font-weight="700" fill="#6b4f10">&lt;&lt;enumeration&gt;&gt; TipoMovimentacao</text>
<text x="1030" y="1823" font-size="11.5" fill="#3b3b3b">ENTRADA | SAIDA</text>
<rect x="40" y="1869" width="470" height="72" rx="6" fill="#fff8e6" stroke="#8a6a1f" stroke-width="1.5"/>
<text x="50" y="1891" font-size="14" font-weight="700" fill="#6b4f10">&lt;&lt;enumeration&gt;&gt; PerfilUsuario</text>
<text x="50" y="1911" font-size="11.5" fill="#3b3b3b">ADMINISTRADOR | ATENDENTE | PRODUCAO</text>
<text x="40" y="1993" font-size="16" font-weight="700" fill="#14213d">Relacionamentos (multiplicidades)</text>
<text x="52" y="2017" font-size="12.5" fill="#374151">Cliente 1 — 0..* Pedido   (bidirecional: Cliente.pedidos / Pedido.cliente)</text>
<text x="52" y="2036" font-size="12.5" fill="#374151">Pedido 1 ◆— 0..* ItemPedido   (composição: cascade ALL + orphanRemoval; bidirecional)</text>
<text x="52" y="2055" font-size="12.5" fill="#374151">Pedido 0..1 — 0..* Arte   (bidirecional; arte personalizada de um pedido. Arte padrão tem pedido nulo)</text>
<text x="52" y="2074" font-size="12.5" fill="#374151">ItemPedido 0..* → 1 Produto   (unidirecional: só ItemPedido conhece Produto)</text>
<text x="52" y="2093" font-size="12.5" fill="#374151">Produto 1 ◆— 0..* Arte   (cascade ALL; bidirecional: Produto.artes / Arte.produto)</text>
<text x="52" y="2112" font-size="12.5" fill="#374151">Pagamento 0..* → 1 Pedido   (unidirecional: só Pagamento conhece Pedido)</text>
