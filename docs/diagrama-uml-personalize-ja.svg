<text x="40" y="1256" font-size="16" font-weight="700" fill="#14213d">Enumerações</text>
<rect x="40" y="1274" width="470" height="72" rx="6" fill="#fff8e6" stroke="#8a6a1f" stroke-width="1.5"/>
<text x="50" y="1296" font-size="14" font-weight="700" fill="#6b4f10">&lt;&lt;enumeration&gt;&gt; StatusPedido</text>
<text x="50" y="1316" font-size="11.5" fill="#3b3b3b">PENDENTE | EM_PRODUCAO | CONCLUIDO | CANCELADO | ENTREGUE</text>
<rect x="530" y="1274" width="470" height="72" rx="6" fill="#fff8e6" stroke="#8a6a1f" stroke-width="1.5"/>
<text x="540" y="1296" font-size="14" font-weight="700" fill="#6b4f10">&lt;&lt;enumeration&gt;&gt; CanalOrigem</text>
<text x="540" y="1316" font-size="11.5" fill="#3b3b3b">WHATSAPP | INSTAGRAM | SITE | PRESENCIAL</text>
<rect x="1020" y="1274" width="470" height="72" rx="6" fill="#fff8e6" stroke="#8a6a1f" stroke-width="1.5"/>
<text x="1030" y="1296" font-size="14" font-weight="700" fill="#6b4f10">&lt;&lt;enumeration&gt;&gt; StatusAprovacao</text>
<text x="1030" y="1316" font-size="11.5" fill="#3b3b3b">PENDENTE | EM_ANALISE | APROVADA | REPROVADA |</text>
<text x="1030" y="1331" font-size="11.5" fill="#3b3b3b">REVISAO_SOLICITADA</text>
<rect x="40" y="1362" width="470" height="72" rx="6" fill="#fff8e6" stroke="#8a6a1f" stroke-width="1.5"/>
<text x="50" y="1384" font-size="14" font-weight="700" fill="#6b4f10">&lt;&lt;enumeration&gt;&gt; StatusPagamento</text>
<text x="50" y="1404" font-size="11.5" fill="#3b3b3b">PENDENTE | APROVADO | RECUSADO | CANCELADO | ESTORNADO</text>
<rect x="530" y="1362" width="470" height="72" rx="6" fill="#fff8e6" stroke="#8a6a1f" stroke-width="1.5"/>
<text x="540" y="1384" font-size="14" font-weight="700" fill="#6b4f10">&lt;&lt;enumeration&gt;&gt; FormaPagamento</text>
<text x="540" y="1404" font-size="11.5" fill="#3b3b3b">DINHEIRO | PIX | CARTAO_CREDITO | CARTAO_DEBITO | BOLETO</text>
<rect x="1020" y="1362" width="470" height="72" rx="6" fill="#fff8e6" stroke="#8a6a1f" stroke-width="1.5"/>
<text x="1030" y="1384" font-size="14" font-weight="700" fill="#6b4f10">&lt;&lt;enumeration&gt;&gt; TipoMovimentacao</text>
<text x="1030" y="1404" font-size="11.5" fill="#3b3b3b">ENTRADA | SAIDA</text>
<rect x="40" y="1450" width="470" height="72" rx="6" fill="#fff8e6" stroke="#8a6a1f" stroke-width="1.5"/>
<text x="50" y="1472" font-size="14" font-weight="700" fill="#6b4f10">&lt;&lt;enumeration&gt;&gt; PerfilUsuario</text>
<text x="50" y="1492" font-size="11.5" fill="#3b3b3b">ADMINISTRADOR | ATENDENTE | PRODUCAO</text>
<text x="40" y="1574" font-size="16" font-weight="700" fill="#14213d">Relacionamentos (multiplicidades)</text>
<text x="52" y="1598" font-size="12.5" fill="#374151">Cliente 1 — 0..* Pedido   (bidirecional: Cliente.pedidos / Pedido.cliente)</text>
<text x="52" y="1617" font-size="12.5" fill="#374151">Pedido 1 ◆— 0..* ItemPedido   (composição: cascade ALL + orphanRemoval; bidirecional)</text>
<text x="52" y="1636" font-size="12.5" fill="#374151">ItemPedido 0..* → 1 Produto   (unidirecional: só ItemPedido conhece Produto)</text>
<text x="52" y="1655" font-size="12.5" fill="#374151">Produto 1 ◆— 0..* Arte   (cascade ALL; bidirecional: Produto.artes / Arte.produto)</text>
<text x="52" y="1674" font-size="12.5" fill="#374151">Pagamento 0..* → 1 Pedido   (unidirecional: só Pagamento conhece Pedido)</text>
<text x="52" y="1693" font-size="12.5" fill="#374151">Material 1 — 0..* MovimentacaoEstoque   (bidirecional)</text>
<text x="52" y="1712" font-size="12.5" fill="#374151">MovimentacaoEstoque 0..* → 1 Usuario   (unidirecional)</text>
